<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>동행길 · API 키 연결</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7ef;color:#244336;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);padding:32px;background:white;border:1px solid #dbe4d4;border-radius:20px;box-shadow:0 14px 45px #2443360c}small{color:#728171}h1{font-size:27px;line-height:1.4;margin:14px 0}p{font-size:14px;line-height:1.8;color:#657566}label{display:block;font-size:14px;font-weight:650;margin:22px 0 10px}input{width:100%;min-height:52px;padding:13px;border:1px solid #bdccba;border-radius:9px;font:16px system-ui;color:#244336}input:focus{outline:3px solid #dfebd6;border-color:#176d52}button{width:100%;min-height:52px;border:0;border-radius:9px;background:#176d52;color:white;font:600 15px system-ui;margin-top:15px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.status{display:none;margin-top:18px;border-radius:9px;padding:13px;white-space:pre-wrap;font-size:14px;line-height:1.7}.status.error{display:block;background:#fff0ea;color:#97451e}.status.success{display:block;background:#eaf4e4;color:#225c3c}.status.warning{display:block;background:#fff6de;color:#755624}a{color:#176d52;font-size:13px;line-height:1.7}.hint{font-size:12px}.continue{display:block;margin-top:19px;text-align:center}.saved{margin:0;color:#728171;font-size:12px}</style></head><body><main class="card"><small>동행길 · 월곡역</small><h1>여기에 API 키를<br>붙여넣어 주세요.</h1><p>터미널 창이 아닌 아래 입력칸에 넣으세요.<br>저장 결과와 Google 연결 결과를 바로 보여드립니다.</p><p id="saved" class="saved"></p><form id="setup"><label for="api-key">Gemini API 키</label><input id="api-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="AIza…" maxlength="4096" required autofocus><p class="hint">입력은 ●로 표시됩니다. 복사할 때 붙는 공백·줄바꿈·따옴표는 자동으로 정리합니다. 키는 이 컴퓨터에만 비공개로 저장하며, 연결 확인을 위해 Google에 전송합니다.</p><button id="save" type="submit">저장하고 연결 확인</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="continue" href="/">키 없이 동행길 시작 →</a></main><script>const form=document.querySelector('#setup'),status=document.querySelector('#status'),button=document.querySelector('#save'),input=document.querySelector('#api-key');fetch('/api/status').then(r=>r.json()).then(d=>{document.querySelector('#saved').textContent=d.configured?'저장된 키가 있습니다. 새 키를 넣으면 교체합니다.':'아직 저장된 키가 없습니다.'}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Google 연결 확인 중…';status.className='status warning';status.textContent='키를 확인하고 있습니다. 잠시 기다려 주세요.';try{const response=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:input.value})});const result=await response.json();if(!response.ok)throw Error(result.error||'키를 저장하지 못했어요.');input.value='';if(result.verified){status.className='status success';status.textContent='키 저장 완료 · Google 모델 연결 확인 완료\n동행길을 엽니다…';setTimeout(()=>location.replace('/'),1200)}else{status.className='status warning';status.textContent=result.error||'키는 저장했지만 연결은 확인하지 못했어요. 네트워크를 확인해 주세요.'}}catch(error){status.className='status error';status.textContent=error.message}finally{button.disabled=false;button.textContent='저장하고 연결 확인'}};</script></body></html>
